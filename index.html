<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timber Calc Pro</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
        p.guide { font-size: 12px; color: #666; text-align: center; margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; resize: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .calc-btn { background: #1a73e8; color: white; }
        .share-btn { background: #25D366; color: white; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        .total-box { margin-top: 15px; padding: 15px; background: #e8f0fe; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #1967d2; }
    </style>
</head>
<body>

<div class="card">
    <h2>Timber Calculator</h2>
    <p class="guide">Formula: (Length × Girth²) / 2304</p>
    <textarea id="inputData" placeholder="Enter: Length, Girth&#10;10, 24&#10;12, 30"></textarea>
    
    <button class="calc-btn" onclick="processData()">Calculate & Generate Table</button>
    <button id="shareBtn" class="share-btn" onclick="shareWhatsApp()">Share via WhatsApp</button>

    <div id="outputArea" style="display:none;">
        <table>
            <thead><tr><th>#</th><th>L</th><th>G</th><th>Volume</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="total-box" id="totalResult"></div>
    </div>
</div>

<script>
let shareText = "";
function processData() {
    const input = document.getElementById('inputData').value;
    const lines = input.split('\n');
    const tableBody = document.getElementById('tableBody');
    let grandTotal = 0;
    let count = 0;
    shareText = "*Timber Calculation Report*\n--------------------------\n";

    lines.forEach((line) => {
        const values = line.split(/[,\s\t]+/).filter(v => v.trim() !== "");
        if (values.length >= 2) {
            const x = parseFloat(values[0]);
            const y = parseFloat(values[1]);
            if (!isNaN(x) && !isNaN(y)) {
                count++;
                const vol = (x * y * y) / 2304;
                grandTotal += vol;
                tableBody.innerHTML += `<tr><td>${count}</td><td>${x}</td><td>${y}</td><td>${vol.toFixed(3)}</td></tr>`;
                shareText += `${count}. L:${x}, G:${y} → *${vol.toFixed(3)}* cu.ft\n`;
            }
        }
    });

    if (count > 0) {
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('shareBtn').style.display = 'block';
        const totalStr = grandTotal.toFixed(3);
        document.getElementById('totalResult').innerText = "Total Volume: " + totalStr + " cu.ft";
        shareText += `--------------------------\n*Total Volume: ${totalStr} cu.ft*`;
    }
}

function shareWhatsApp() {
    const url = "https://wa.me/?text=" + encodeURIComponent(shareText);
    window.open(url, '_blank');
}
</script>
</body>
</html>
