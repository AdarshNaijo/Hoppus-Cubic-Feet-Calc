<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTI Timber Calc Pro</title>
    <meta name="theme-color" content="#1e3a8a">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">
    <style>
        :root { --bg: #f4f7f9; --card-bg: #ffffff; --text: #333; --primary: #1e3a8a; --secondary: #64748b; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --primary: #3b82f6; --secondary: #94a3b8; }
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .theme-toggle { position: absolute; top: 0; right: 0; background: none; border: 1px solid var(--secondary); color: var(--text); padding: 5px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 10px; background: var(--card-bg); color: var(--text); outline: none; box-sizing: border-box; }
        .unit-toggle-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; }
        .unit-btn { padding: 8px 12px; border: 1px solid var(--primary); border-radius: 20px; background: none; color: var(--primary); font-size: 11px; font-weight: bold; flex: 1; cursor: pointer; }
        .unit-btn.active { background: var(--primary); color: white; }
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .calc-btn { background: var(--primary); color: white; }
        .share-btn { background: #25D366; color: white; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #edf2f7; padding: 10px; font-size: 14px; text-align: left; }
        .total-box { margin-top: 15px; padding: 15px; background: #eff6ff; border-radius: 12px; text-align: center; font-size: 20px; font-weight: bold; color: var(--primary); border: 1px solid #bfdbfe; }
        .history-item { font-size: 13px; padding: 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .sync-status { font-size: 10px; text-align: center; color: #25D366; margin-top: 5px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        <h2>MTI Timber Calc</h2>
        <p style="font-size: 12px; color: var(--secondary);">Menachery Timber Industries</p>
    </div>
    <input type="text" id="customerName" placeholder="Customer Name (Optional)">
    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label style="font-size: 11px; font-weight: bold; color: var(--secondary);">WOOD TYPE:</label>
            <select id="woodType">
                <option value="Teak 🪵">Teak 🪵</option>
                <option value="Mahogany 🌳">Mahogany 🌳</option>
                <option value="Jackfruit 🌳">Jackfruit 🌳</option>
                <option value="Coconut 🥥">Coconut 🥥</option>
                <option value="Mango 🥭">Mango 🥭</option>
                <option value="Other 🪵">Other</option>
            </select>
        </div>
    </div>
    <div class="unit-toggle-container">
        <button id="btnFt" class="unit-btn active" onclick="setUnit('ft')">Feet</button>
        <button id="btnCm" class="unit-btn" onclick="setUnit('cm')">CM</button>
        <button id="btnM" class="unit-btn" onclick="setUnit('m')">Meter</button>
    </div>
    <textarea id="inputData" placeholder="Enter L, G per line"></textarea>
    <button class="calc-btn" onclick="handleCalculate()">Calculate & Auto-Sync</button>
    <div id="syncStatus" class="sync-status">✔ Synced to Google Drive</div>
    <button id="shareBtn" class="share-btn" onclick="shareWhatsApp()">Share via WhatsApp</button>
    <div id="outputArea" style="display:none;">
        <table id="resultsTable">
            <thead><tr><th>#</th><th>Type</th><th id="unitHeader">Vol</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="total-box" id="totalResult"></div>
    </div>
    <div style="margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 20px;">
        <h3 style="font-size: 13px; color: var(--secondary);">History (Tap to view)</h3>
        <div id="historyList"></div>
    </div>
</div>
<script>
let currentUnit = 'ft';
let shareText = "";
const DRIVE_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE"; 

function setUnit(u) {
    currentUnit = u;
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn' + u.charAt(0).toUpperCase() + u.slice(1)).classList.add('active');
    document.getElementById('unitHeader').innerText = u === 'ft' ? 'Vol (ft³)' : 'Vol (m³)';
}
function handleCalculate() {
    const rawInput = document.getElementById('inputData').value;
    const type = document.getElementById('woodType').value;
    const customer = document.getElementById('customerName').value || "Counter Sale";
    const result = runCalculation(rawInput, type, customer);
    if (result.count > 0) {
        saveToHistory(result.total, result.count, rawInput, currentUnit, type, customer);
        autoSync(result.total, result.count, rawInput, type, customer);
    }
}
function runCalculation(raw, type, customer) {
    const lines = raw.split('\n');
    const body = document.getElementById('tableBody');
    body.innerHTML = '';
    let total = 0, count = 0;
    let divisor = (currentUnit === 'ft') ? 2304 : (currentUnit === 'cm' ? 4000000 : 4);
    let label = (currentUnit === 'ft') ? 'ft³' : 'm³';
    shareText = `*MTI Report*\n*Customer:* ${customer}\n*Type:* ${type}\n--------------------------\n`;
    lines.forEach((line) => {
        const v = line.split(/[,\s\t]+/).filter(x => x.trim() !== "");
        if (v.length >= 2) {
            count++;
            const vol = (parseFloat(v[0]) * Math.pow(parseFloat(v[1]), 2)) / divisor;
            total += vol;
            body.innerHTML += `<tr><td>${count}</td><td>${type}</td><td><b>${vol.toFixed(3)} ${label}</b></td></tr>`;
            shareText += `${count}. L:${v[0]}, G:${v[1]} → *${vol.toFixed(3)}* ${label}\n`;
        }
    });
    if (count > 0) {
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('shareBtn').style.display = 'block';
        document.getElementById('totalResult').innerText = `Total: ${total.toFixed(3)} ${label}`;
    }
    return { total: total.toFixed(3), count };
}
function saveToHistory(t, c, r, u, type, customer) {
    let h = JSON.parse(localStorage.getItem('mti_v12') || "[]");
    const ts = new Date().toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
    h.unshift({ t, c, ts, r, u, type, customer });
    localStorage.setItem('mti_v12', JSON.stringify(h.slice(0, 20)));
    displayHistory();
}
function displayHistory() {
    const h = JSON.parse(localStorage.getItem('mti_v12') || "[]");
    const list = document.getElementById('historyList');
    list.innerHTML = h.length ? '' : '<p style="font-size:11px;">No history.</p>';
    h.forEach((item, i) => {
        list.innerHTML += `<div class="history-item" onclick="reloadPast(${i})">
            <span><b>${item.t}</b> (${item.type})<br><small>${item.customer}</small></span>
            <span style="color:#666">${item.ts} ❯</span>
        </div>`;
    });
}
async function autoSync(total, count, raw, type, customer) {
    const month = new Date().toLocaleString('default', { month: 'long' });
    const ts = new Date().toLocaleString();
    const content = `[${ts}] CUSTOMER: ${customer} | TYPE: ${type} | TOTAL: ${total} | LOGS: ${raw.replace(/\n/g, ' ')}`;
    const status = document.getElementById('syncStatus');
    status.style.display = 'block'; status.innerText = "Syncing...";
    try {
        await fetch(DRIVE_URL, { method: 'POST', body: JSON.stringify({ month, content }) });
        status.innerText = "✔ Auto-Synced to Google Drive";
    } catch (e) { status.innerText = "✖ Sync Failed (Check Internet)"; }
}
function reloadPast(i) {
    const item = JSON.parse(localStorage.getItem('mti_v12'))[i];
    setUnit(item.u);
    document.getElementById('woodType').value = item.type;
    document.getElementById('customerName').value = item.customer;
    document.getElementById('inputData').value = item.r;
    runCalculation(item.r, item.type, item.customer);
    window.scrollTo({top: 0, behavior: 'smooth'});
}
function toggleTheme() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
function shareWhatsApp() { window.open("https://wa.me/?text=" + encodeURIComponent(shareText), '_blank'); }
window.onload = () => { displayHistory(); };
</script>
</body>
</html>
