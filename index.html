<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTI Timber Calc</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">

    <style>
        :root {
            --bg: #f4f7f9; --card-bg: #ffffff; --text: #333333;
            --primary: #1e3a8a; --secondary: #64748b;
            --input-border: #e0e0e0; --row-border: #edf2f7;
            --total-bg: #eff6ff; --total-border: #bfdbfe;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc;
            --primary: #3b82f6; --secondary: #94a3b8;
            --input-border: #334155; --row-border: #334155;
            --total-bg: #1e3a8a; --total-border: #2563eb;
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .theme-toggle { position: absolute; top: 0; right: 0; background: none; border: 1px solid var(--secondary); color: var(--text); padding: 5px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        
        h2 { color: var(--primary); margin: 5px 0; font-size: 18px; text-transform: uppercase; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 2px solid var(--input-border); border-radius: 10px; font-size: 16px; box-sizing: border-box; background: var(--card-bg); color: var(--text); font-family: monospace; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .calc-btn { background: var(--primary); color: white; }
        .share-btn { background: #25D366; color: white; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { color: var(--secondary); font-size: 11px; text-transform: uppercase; padding: 10px; text-align: left; border-bottom: 2px solid var(--row-border); }
        td { border-bottom: 1px solid var(--row-border); padding: 10px; font-size: 14px; }
        
        .total-box { margin-top: 15px; padding: 15px; background: var(--total-bg); border-radius: 12px; text-align: center; font-size: 20px; font-weight: bold; border: 1px solid var(--total-border); }
        
        .history-item { font-size: 13px; padding: 12px; border-bottom: 1px solid var(--row-border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-item:active { background: var(--row-border); }
        .clear-btn { background: none; color: #ef4444; font-size: 11px; text-decoration: underline; width: auto; display: block; margin-left: auto; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        <h2>MTI Timber Calc</h2>
        <p style="font-size: 12px; color: var(--secondary);">Enter Length, Girth per line</p>
    </div>
    
    <textarea id="inputData" placeholder="10, 24&#10;12, 30"></textarea>
    
    <button class="calc-btn" onclick="processData()">Calculate & Save</button>
    <button id="shareBtn" class="share-btn" onclick="shareWhatsApp()">Share via WhatsApp</button>

    <div id="outputArea" style="display:none;">
        <table id="resultsTable">
            <thead><tr><th>#</th><th>L</th><th>G</th><th>Vol</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="total-box" id="totalResult"></div>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid var(--input-border); padding-top: 20px;">
        <h3 style="font-size: 14px; color: var(--secondary);">Recent Calculations (Click to view)</h3>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<script>
let shareText = "";

function toggleTheme() {
    const target = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', target);
    localStorage.setItem('mtiTheme', target);
}

window.onload = () => {
    const savedTheme = localStorage.getItem('mtiTheme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    displayHistory();
};

function processData() {
    const rawInput = document.getElementById('inputData').value;
    const lines = rawInput.split('\n');
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';
    let grandTotal = 0;
    let count = 0;
    let logList = [];

    shareText = "*Menachery Timber Industries*\n*Report*\n--------------------------\n";

    lines.forEach((line) => {
        const values = line.split(/[,\s\t]+/).filter(v => v.trim() !== "");
        if (values.length >= 2) {
            const x = parseFloat(values[0]);
            const y = parseFloat(values[1]);
            if (!isNaN(x) && !isNaN(y)) {
                count++;
                const vol = (x * y * y) / 2304;
                grandTotal += vol;
                logList.push({x, y, vol: vol.toFixed(3)});
                tableBody.innerHTML += `<tr><td>${count}</td><td>${x}</td><td>${y}</td><td><b>${vol.toFixed(3)}</b></td></tr>`;
                shareText += `${count}. L:${x}, G:${y} → *${vol.toFixed(3)}* ft³\n`;
            }
        }
    });

    if (count > 0) {
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('shareBtn').style.display = 'block';
        const totalStr = grandTotal.toFixed(3);
        document.getElementById('totalResult').innerText = "Total: " + totalStr + " cu.ft";
        shareText += `--------------------------\n*Total: ${totalStr} cu.ft*`;
        saveToHistory(totalStr, count, rawInput);
    }
}

function saveToHistory(total, count, rawInput) {
    let history = JSON.parse(localStorage.getItem('mtiFullHistory') || "[]");
    const timestamp = new Date().toLocaleString([], {hour: '2-digit', minute:'2-digit', day:'numeric', month:'short'});
    // We save the raw text input so we can "reload" it later
    history.unshift({ total, count, timestamp, rawInput });
    history = history.slice(0, 15); 
    localStorage.setItem('mtiFullHistory', JSON.stringify(history));
    displayHistory();
}

function displayHistory() {
    const history = JSON.parse(localStorage.getItem('mtiFullHistory') || "[]");
    const list = document.getElementById('historyList');
    list.innerHTML = history.length ? '' : '<p style="font-size:11px;color:#999;">No history yet.</p>';
    history.forEach((item, index) => {
        list.innerHTML += `
            <div class="history-item" onclick="viewPastCalc(${index})">
                <span><b>${item.total} ft³</b> (${item.count} logs)</span>
                <span style="color:var(--secondary)">${item.timestamp} ❯</span>
            </div>`;
    });
}

function viewPastCalc(index) {
    const history = JSON.parse(localStorage.getItem('mtiFullHistory'));
    const item = history[index];
    // Put the old logs back into the text area
    document.getElementById('inputData').value = item.rawInput;
    // Run calculation again to show the table
    processData();
    // Scroll to top so they see the result
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearHistory() { 
    if(confirm("Delete all history?")) {
        localStorage.removeItem('mtiFullHistory'); 
        displayHistory(); 
    }
}

function shareWhatsApp() {
    window.open("https://wa.me/?text=" + encodeURIComponent(shareText), '_blank');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      const cacheName = 'mti-v7';
      const assets = ['./', './index.html', './manifest.json', './icon.png'];
      self.addEventListener('install', e => { e.waitUntil(caches.open(cacheName).then(cache => cache.addAll(assets))); });
      self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))); });
    `;
    const blob = new Blob([swCode], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  });
}
</script>
</body>
</html>
