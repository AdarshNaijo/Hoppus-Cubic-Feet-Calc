<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTI Cloud Ledger</title>
    <style>
        :root { --bg: #f4f7f9; --card-bg: #ffffff; --text: #333; --primary: #1e3a8a; --secondary: #64748b; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --primary: #3b82f6; --secondary: #94a3b8; }
        body { font-family: 'Segoe UI', sans-serif; padding: 10px; background: var(--bg); color: var(--text); margin: 0; font-size: 13px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 8px; background: var(--card-bg); color: var(--text); box-sizing: border-box; }
        .u-btn { flex: 1; padding: 8px; border: 1px solid var(--primary); background: none; color: var(--primary); border-radius: 6px; font-weight: bold; font-size: 11px; }
        .u-btn.active { background: var(--primary); color: white; }
        .calc-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
        .table-container { overflow-x: auto; margin-top: 15px; background: white; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; color: #333; }
        th { background: #f1f5f9; padding: 8px; border-bottom: 2px solid #ddd; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .summary-card { background: #eff6ff; padding: 12px; border-radius: 10px; margin-top: 15px; border: 1px solid #bfdbfe; }
        .filter-section { background: #f1f5f9; padding: 12px; border-radius: 10px; margin-top: 20px; border: 1px solid #e2e8f0; }
        .fetch-btn { background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="card">
    <div style="text-align:center; margin-bottom:15px;">
        <h2 style="margin:0; color:var(--primary);">MTI Cloud Ledger</h2>
        <p style="margin:0; font-size:11px; color:var(--secondary);">Menachery Timber Industries</p>
    </div>

    <input type="text" id="customerName" placeholder="Cstmr Name">
    <select id="woodType">
        <option value="Teak 🪵">Teak 🪵</option>
        <option value="Mahogany 🌳">Mahogany 🌳</option>
        <option value="Jackfruit 🌳">Jackfruit 🌳</option>
        <option value="Coconut 🥥">Coconut 🥥</option>
        <option value="Mango 🥭">Mango 🥭</option>
        <option value="Other 🪵">Other</option>
    </select>

    <div style="display:flex; gap:5px; margin-bottom:10px;">
        <button id="btnFt" class="u-btn active" onclick="setUnit('ft')">Feet</button>
        <button id="btnCm" class="u-btn" onclick="setUnit('cm')">CM</button>
        <button id="btnM" class="u-btn" onclick="setUnit('m')">Meter</button>
    </div>
    
    <textarea id="inputData" rows="3" placeholder="L, G (one per line)"></textarea>
    <button class="calc-btn" onclick="handleCalculate()">Calculate & Cloud Sync</button>
    <div id="syncStatus" style="font-size:10px; text-align:center; margin-top:5px; color:#10b981; font-weight:bold;"></div>

    <div class="filter-section">
        <h3 style="font-size:13px; margin:0 0 10px 0;">📂 Cloud Archive Explorer</h3>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <select id="filterYear" style="flex:1;">
                <option value="2026">2026</option><option value="2027">2027</option>
            </select>
            <select id="filterMonth" style="flex:1;">
                <option value="Jan">Jan</option><option value="Feb">Feb</option><option value="Mar">Mar</option>
                <option value="Apr">Apr</option><option value="May">May</option><option value="Jun">Jun</option>
            </select>
        </div>
        <button class="fetch-btn" onclick="fetchFromCloud()">Load Month from Drive</button>
        
        <input type="text" id="searchCstmr" placeholder="Filter by Name/Type/Date..." onkeyup="applyLocalFilters()">
        
        <div id="cloudDisplay" class="table-container"></div>
        <div id="filterSummary"></div>
    </div>
</div>

<script>
let currentUnit = 'ft';
let cloudData = []; // This keeps phone memory clean - only holds what is currently fetched
const DRIVE_URL = "YOUR_APPS_SCRIPT_URL_HERE";

function setUnit(u) {
    currentUnit = u;
    document.querySelectorAll('.u-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn' + u.charAt(0).toUpperCase() + u.slice(1)).classList.add('active');
}

function handleCalculate() {
    const raw = document.getElementById('inputData').value;
    const type = document.getElementById('woodType').value;
    const cstmr = document.getElementById('customerName').value || "Counter Sale";
    const now = new Date();
    const ts = now.toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
    const month = now.toLocaleString('default', { month: 'short' });
    const year = now.getFullYear().toString();
    
    const lines = raw.split('\n');
    let divisor = (currentUnit === 'ft') ? 2304 : (currentUnit === 'cm' ? 4000000 : 4);

    lines.forEach((line) => {
        const v = line.split(/[,\s\t]+/).filter(x => x.trim() !== "");
        if (v.length >= 2) {
            const vol = (parseFloat(v[0]) * Math.pow(parseFloat(v[1]), 2)) / divisor;
            const content = `\t${cstmr}\t${type}\t${v[0]}\t${v[1]}\t${vol.toFixed(3)}\t${ts}`;
            syncToCloud(year, month, content);
        }
    });
    alert("Logs sent to Cloud!");
    document.getElementById('inputData').value = "";
}

async function syncToCloud(year, month, content) {
    const status = document.getElementById('syncStatus');
    status.innerText = "Syncing...";
    try {
        await fetch(DRIVE_URL, { method: 'POST', body: JSON.stringify({ year, month, content }) });
        status.innerText = "✔ Saved to Drive";
        setTimeout(() => status.innerText = "", 2000);
    } catch (e) { status.innerText = "✖ Offline"; }
}

async function fetchFromCloud() {
    const year = document.getElementById('filterYear').value;
    const month = document.getElementById('filterMonth').value;
    const display = document.getElementById('cloudDisplay');
    display.innerHTML = "Fetching from Drive...";
    
    try {
        const response = await fetch(`${DRIVE_URL}?year=${year}&month=${month}`);
        const text = await response.text();
        parseCloudText(text);
    } catch (e) { display.innerHTML = "Error fetching data."; }
}

function parseCloudText(text) {
    const lines = text.split('\n');
    cloudData = [];
    lines.forEach(line => {
        const p = line.split('\t');
        if(p.length >= 6) {
            cloudData.push({ cstmr: p[1], type: p[2], l: p[3], g: p[4], vol: p[5], ts: p[6] });
        }
    });
    applyLocalFilters();
}

function applyLocalFilters() {
    const query = document.getElementById('searchCstmr').value.toLowerCase();
    const display = document.getElementById('cloudDisplay');
    const summary = document.getElementById('filterSummary');
    
    const filtered = cloudData.filter(i => 
        i.cstmr.toLowerCase().includes(query) || 
        i.type.toLowerCase().includes(query) || 
        i.ts.toLowerCase().includes(query)
    );

    let html = '<table><thead><tr><th>No.</th><th>Cstmr</th><th>Type</th><th>L</th><th>G</th><th>Vol.</th></tr></thead><tbody>';
    let woodTotals = {};
    let grandTotal = 0;

    filtered.forEach((i, idx) => {
        html += `<tr><td>${idx+1}</td><td>${i.cstmr}</td><td>${i.type}</td><td>${i.l}</td><td>${i.g}</td><td>${i.vol}</td></tr>`;
        woodTotals[i.type] = (woodTotals[i.type] || 0) + parseFloat(i.vol);
        grandTotal += parseFloat(i.vol);
    });
    
    display.innerHTML = html + '</tbody></table>';
    let summaryHtml = '<div class="summary-card"><h4>Summary</h4>';
    for (let type in woodTotals) summaryHtml += `<div>${type}: <b>${woodTotals[type].toFixed(3)} ft³</b></div>`;
    summaryHtml += `<hr><div><b>Total: ${grandTotal.toFixed(3)} ft³</b></div></div>`;
    summary.innerHTML = filtered.length > 0 ? summaryHtml : '';
}
</script>
</body>
</html>
